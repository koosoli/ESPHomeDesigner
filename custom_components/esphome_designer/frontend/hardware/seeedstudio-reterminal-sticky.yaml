# ============================================================================
# ESPHome YAML - Generated by ESPHome Designer
# ============================================================================
# TARGET DEVICE: Seeed Studio reTerminal Sticky
# Name: Seeed Studio reTerminal Sticky
# Resolution: 800x480
# Shape: rect
# Orientation: landscape
# Chip: esp32-s3
# Board: esp32-s3-devkitc-1
# ============================================================================
#
# HARDWARE NOTES:
#         - ESP32-S3 with 8MB Octal PSRAM and 32MB Flash.
#         - 3.97" 800x480 E-Paper Display (SSD1677, 4-level grayscale) via epaper_spi.
#         - Touchscreen: GT911 capacitive touch over I2C.
#         - GPIO45 (PWR_HOLD) and GPIO46 (PWR_LOCK) must be held HIGH to keep power on.
#         - GPIO42 enables power to the touchscreen.
#         - GPIO39 enables battery charging (active low).
#         - Physical buttons: UP (GPIO5), DOWN (GPIO6), OK (GPIO4).
#         - Buzzer: GPIO48 (LEDC PWM).
#         - Sensors: SHT40 temperature/humidity (I2C 0x44), BQ27220 fuel gauge (I2C 0x55), PCF8563 RTC (I2C 0x51).
#
# SETUP INSTRUCTIONS:
#
# STEP 1: Copy the Material Design Icons font file
#         - From this repo: resources/fonts/materialdesignicons-webfont.ttf
#         - To ESPHome: /config/esphome/fonts/materialdesignicons-webfont.ttf
#         (Create the fonts folder if it doesn't exist)
#
# STEP 2: Create a new device in ESPHome
#         - Click "New Device"
#         - Select: ESP32-S3
#         - Board: esp32-s3-devkitc-1
#         - Framework: ESP-IDF
#
# STEP 3: PASTE this snippet into your device YAML
#         - System sections (esphome, esp32, psram, etc.) are auto-commented
#           to avoid conflicts with your existing setup.
#
# ============================================================================

esphome:
  min_version: 2026.7.0
  project:
    name: "Seeed.reTerminal-Sticky"
    version: "1.0"
  on_boot:
    - priority: 600
      then:
        - output.turn_on: pwr_hold
        - output.turn_on: pwr_lock
        - switch.turn_on: touch_power_enable
        - output.turn_on: charge_enable

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_MODE_OCT: y

psram:
  mode: octal
  speed: 80MHz

spi:
  - id: epaper_spi_bus
    clk_pin: GPIO13
    mosi_pin: GPIO14
    miso_pin: GPIO12

i2c:
  - id: i2c_sensors
    sda: GPIO1
    scl: GPIO0
    scan: false
    frequency: 400kHz
  - id: i2c_touch
    sda: GPIO3
    scl: GPIO2
    scan: false
    frequency: 100kHz

output:
  - platform: gpio
    pin: GPIO45
    id: pwr_hold
  - platform: gpio
    pin: GPIO46
    id: pwr_lock
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: charge_enable
  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 1000Hz

switch:
  - platform: gpio
    pin: GPIO42
    id: touch_power_enable
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: gt911
    id: device_touchscreen
    display: my_display
    i2c_id: i2c_touch
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    transform:
      mirror_y: true

display:
  - platform: epaper_spi
    id: my_display
    model: seeed-reterminal-sticky
    rotation: 0
    update_interval: never
    # __LAMBDA_PLACEHOLDER__

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Button Up"
    id: button_up
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    name: "Button Down"
    id: button_down
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Button OK"
    id: button_ok
  # __TOUCH_SENSORS_PLACEHOLDER__
